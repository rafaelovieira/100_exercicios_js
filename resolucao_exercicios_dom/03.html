<!---Crie uma página que gere um número aleatório entre 1 e 100 e permita que o usuário tente adivinhar. 
Informe se a tentativa é maior, menor ou igual ao número gerado.-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número Aleatório</title>
</head>
<body>
    
    <h1>Adivinhe o número sorteado</h1>
    <p>Escolha um número entre <strong>1</strong> e <strong>100</strong> para tentar adivinhar o número sorteado:</p>
    <input type="number" id="num" min="0" max="100" placeholder="Insira aqui...">
    <button onclick="numeroAleatorio()">Verificar</button>
    <p id="resultado"></p>

    <script>
        function numeroAleatorio() {
            const input = document.getElementById('num').value
                if (input === '' || input === null || input > 100) {
                    document.getElementById('resultado').innerText = "Insira um número válido para verificar!"
                    return
                }

            const numAleatorio = Math.floor(Math.random() * 100) + 1
            const n = parseInt(input)
                if (input === numAleatorio) {
                    document.getElementById('resultado').innerText = "Parabéns, o número escolhido é o mesmo que o sorteado!"
                } else if (input > numAleatorio) {
                    document.getElementById('resultado').innerText = "O número escolhido é maior que o número sorteado!"
                } else {
                    document.getElementById('resultado').innerText = "O número escolhido é menor que o número sorteado!"
                }
        }
    </script>

</body>
</html>
